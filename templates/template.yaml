AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 con Apache creada desde GitHub Actions

Parameters:
  InstanceDescription:
    Description: Descripcion del servidor web
    Type: String
    Default: Servidor Web Apache

  SecurityGroupDescription:
    Description: Security Group Description
    Type: String
    Default: Acceso HTTP al servidor

Resources:

  MyInstanceClase:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: us-east-1a
      ImageId: ami-0236922087fa98b6e
      InstanceType: t3.micro
      SecurityGroupIds:
        - !GetAtt ServerSecurityGroupClase.GroupId
      Tags:
        - Key: Name
          Value: EC2-Clase-CF
        - Key: Proyecto
          Value: Class-CloudFormation
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          cat > /var/www/html/index.html <<'EOF2'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <title>Taller CloudFormation</title>
            <style>
              body { font-family: Arial, sans-serif; background: #1f2937; color: #f9fafb; text-align: center; padding: 50px; }
              h1 { color: #38bdf8; }
              .card { background: #374151; display: inline-block; padding: 30px 50px; border-radius: 12px; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>${InstanceDescription}</h1>
              <h2>Marcos Castellanos - 0192059</h2>
              <p>Ingenieria de Sistemas - Cloud Computing - UFPSO</p>
              <p>Desplegado con CloudFormation y GitHub Actions</p>
            </div>
          </body>
          </html>
          EOF2

  ServerSecurityGroupClase:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Ref SecurityGroupDescription
      Tags:
        - Key: Name
          Value: SG-HTTP-Clase-CF
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

Outputs:

  InstanceId:
    Description: ID de la instancia EC2
    Value: !Ref MyInstanceClase

  PublicIP:
    Description: IP publica de la instancia
    Value: !GetAtt MyInstanceClase.PublicIp

  WebsiteURL:
    Description: URL del sitio web
    Value: !Sub http://${MyInstanceClase.PublicIp}
