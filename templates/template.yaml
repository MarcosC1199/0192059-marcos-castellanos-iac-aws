AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 con Apache creada desde GitHub Actions

Parameters:
  InstanceDescription:
    Description: Descripcion del servidor web
    Type: String
    Default: Servidor Web Apache - Version 2

  SecurityGroupDescription:
    Description: Security Group Description
    Type: String
    Default: Acceso HTTP al servidor

Resources:

  MyInstanceClase2:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: us-east-1a
      ImageId: ami-0236922087fa98b6e
      InstanceType: t3.micro
      SecurityGroupIds:
        - !GetAtt ServerSecurityGroupClase.GroupId
      Tags:
        - Key: Name
          Value: EC2-Clase-CF-V2
        - Key: Proyecto
          Value: Class-CloudFormation
        - Key: Estudiante
          Value: Marcos-Castellanos
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          cat > /var/www/html/index.html <<'EOF2'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <title>Taller CloudFormation - V2</title>
            <style>
              body { font-family: Georgia, serif; background: #064e3b; color: #ecfdf5; text-align: center; padding: 50px; }
              h1 { color: #fbbf24; font-size: 2.5em; }
              .card { background: #065f46; display: inline-block; padding: 30px 50px; border-radius: 16px; border: 3px solid #fbbf24; }
              a { color: #fde68a; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>${InstanceDescription}</h1>
              <h2>Marcos Castellanos - 0192059</h2>
              <p>Ingenieria de Sistemas - Cloud Computing - UFPSO</p>
              <p>Desplegado con CloudFormation y GitHub Actions</p>
              <p><a href="https://github.com/MarcosC1199/0192059-marcos-castellanos-iac-aws">Ver el repositorio del proyecto</a></p>
            </div>
          </body>
          </html>
          EOF2

  ServerSecurityGroupClase:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Ref SecurityGroupDescription
      Tags:
        - Key: Name
          Value: SG-HTTP-Clase-CF
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

Outputs:

  InstanceId:
    Description: ID de la instancia EC2
    Value: !Ref MyInstanceClase2

  PublicIP:
    Description: IP publica de la instancia
    Value: !GetAtt MyInstanceClase2.PublicIp

  WebsiteURL:
    Description: URL del sitio web
    Value: !Sub http://${MyInstanceClase2.PublicIp}
